server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library
    username: root
    password: your_new_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

batch:
  loan-notification:
    cron: "*/60 * * * * *"
